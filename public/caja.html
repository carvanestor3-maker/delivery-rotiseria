<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Caja & Despacho (Celular 2) - Gestión de Cobros</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans select-none">

  <!-- Header de Caja (Celular 2) -->
  <header class="bg-slate-800 border-b border-slate-700 px-4 py-2.5 flex justify-between items-center shadow-lg sticky top-0 z-30">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 bg-emerald-600 rounded-xl flex items-center justify-center text-white font-bold text-lg shadow">
        💰
      </div>
      <div>
        <h1 class="text-sm sm:text-base font-black tracking-wide flex items-center gap-1.5 leading-tight">
          CAJA & DESPACHO
          <span id="socket-status" class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
            🟢 En vivo
          </span>
        </h1>
        <p class="text-[10px] text-slate-400 leading-none">Celular 2 - Cobros y Rendición</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <span id="shift-status-badge-caja" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">🟢 Caja Abierta</span>
      <button id="btn-open-shift-caja" onclick="openOpenShiftModal()" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold transition flex items-center gap-1">
        🔓 Abrir
      </button>
      <button id="btn-close-shift-caja" onclick="openCloseShiftModal()" class="px-2.5 py-1 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-xs font-bold border border-slate-600 transition flex items-center gap-1">
        🔒 Cerrar
      </button>
      <button onclick="loadCashSummary()" class="p-1.5 bg-slate-700 hover:bg-slate-600 rounded-xl text-xs font-bold border border-slate-600 transition">
        <i data-lucide="refresh-cw" class="w-4 h-4 text-slate-300"></i>
      </button>
    </div>
  </header>

  <!-- Tarjetas Resumen de Caja en la Parte Superior del Celular -->
  <div class="bg-slate-950 p-3 border-b border-slate-800 shadow">
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
      <div class="bg-slate-900 p-2.5 rounded-xl border border-emerald-500/30">
        <span class="text-[10px] text-slate-400 block font-bold">💵 EFECTIVO EN CAJA</span>
        <span id="cash-collected-val" class="text-base font-black text-emerald-400 font-mono">$0</span>
      </div>

      <div class="bg-slate-900 p-2.5 rounded-xl border border-amber-500/30">
        <span class="text-[10px] text-slate-400 block font-bold">⏳ EFECTIVO PENDIENTE</span>
        <span id="cash-pending-val" class="text-base font-black text-amber-400 font-mono">$0</span>
      </div>

      <div class="bg-slate-900 p-2.5 rounded-xl border border-blue-500/30">
        <span class="text-[10px] text-slate-400 block font-bold">💳 TARJETAS / POSNET</span>
        <span id="card-total-val" class="text-base font-black text-blue-400 font-mono">$0</span>
      </div>

      <div class="bg-slate-900 p-2.5 rounded-xl border border-purple-500/30">
        <span class="text-[10px] text-slate-400 block font-bold">📱 MERCADOPAGO / CBU</span>
        <span id="digital-total-val" class="text-base font-black text-purple-400 font-mono">$0</span>
      </div>
    </div>
  </div>

  <!-- Pestañas de Filtro para la Caja -->
  <nav class="bg-slate-800 px-2 py-2 flex gap-1.5 overflow-x-auto no-scrollbar border-b border-slate-700 sticky top-[53px] z-20">
    <button onclick="setFilter('pending')" id="tab-pending" class="tab-btn active bg-orange-500 text-white font-bold px-3 py-1.5 rounded-xl text-xs whitespace-nowrap shadow transition flex items-center gap-1">
      ⏳ Por Cobrar / Rendir <span id="count-pending" class="bg-amber-400 text-slate-900 px-1.5 rounded-full text-[10px] font-black">0</span>
    </button>
    <button onclick="setFilter('paid')" id="tab-paid" class="tab-btn bg-slate-700 text-slate-300 font-bold px-3 py-1.5 rounded-xl text-xs whitespace-nowrap transition flex items-center gap-1">
      ✅ Cobrados en Caja <span id="count-paid" class="bg-emerald-500/30 text-emerald-300 px-1.5 rounded-full text-[10px]">0</span>
    </button>
    <button onclick="setFilter('all')" id="tab-all" class="tab-btn bg-slate-700 text-slate-300 font-bold px-3 py-1.5 rounded-xl text-xs whitespace-nowrap transition">
      🔥 Todos los Pedidos
    </button>
  </nav>

  <!-- Lista de Pedidos en Caja -->
  <main class="flex-1 p-3 overflow-y-auto space-y-3">
    <div id="caja-orders-container" class="space-y-3">
      <!-- Se puebla dinámicamente -->
    </div>
  </main>

  <!-- ÁREA DE IMPRESIÓN DE TICKET TÉRMICO -->
  <div id="print-area">
    <!-- Se llena dinámicamente -->
  </div>

  <!-- MODAL DE APERTURA DE TURNO DE CAJA (REQUERIDO PIN NIVEL 2 O 3) -->
  <div id="open-shift-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200 text-slate-900">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b pb-3 border-slate-200">
        <h3 class="font-extrabold text-emerald-900 text-lg flex items-center gap-2">
          🔓 Abrir Turno de Caja (Nivel 2)
        </h3>
        <button onclick="closeOpenShiftModal()" class="text-slate-400 hover:text-slate-700">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="open-shift-form" onsubmit="submitOpenShift(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Número de Caja a Habilitar *</label>
          <select id="shift-box-number" required class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-500 font-extrabold bg-white text-slate-900">
            <option value="1">Caja N° 1 (Estación Principal)</option>
            <option value="2" selected>Caja N° 2 (Estación Secundaria / Celular 2)</option>
            <option value="3">Caja N° 3 (Estación Auxiliar)</option>
            <option value="4">Caja N° 4</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Nombre del Cajero / Operativo asignado a la Caja *</label>
          <input type="text" id="shift-cashier-name" required placeholder="Ej: Sofía Gómez (o tu nombre si cobras tú)" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-500 font-bold">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Monto Inicial de Cambio en Caja ($) *</label>
          <input type="number" step="100" id="shift-initial-cash" required placeholder="Ej: 10000" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-500 font-mono font-bold">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">🔑 Clave / PIN Personal (Encargado Nivel 2 o Gerente Nivel 3) *</label>
          <input type="password" id="shift-open-pin" required placeholder="Tu PIN personal (ej: 2222)" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-500 font-mono">
        </div>

        <div class="pt-4 flex justify-end gap-2 border-t border-slate-200">
          <button type="button" onclick="closeOpenShiftModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 font-bold rounded-xl text-xs text-slate-700">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 font-bold rounded-xl text-xs text-white shadow">Abrir Turno de Caja</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL DE CIERRE DE TURNO DE CAJA (REQUERIDO PIN NIVEL 2 O 3) -->
  <div id="close-shift-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200 text-slate-900">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b pb-3 border-slate-200">
        <h3 class="font-extrabold text-slate-900 text-lg flex items-center gap-2">
          🔒 Cerrar Turno de Caja (Nivel 2)
        </h3>
        <button onclick="closeCloseShiftModal()" class="text-slate-400 hover:text-slate-700">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="close-shift-form" onsubmit="submitCloseShift(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Seleccionar Caja Abierta a Cerrar *</label>
          <select id="shift-close-box-id" required class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-slate-500 font-extrabold bg-white text-slate-900">
            <!-- Se llena dinámicamente -->
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Monto Final Arqueado en Efectivo ($) *</label>
          <input type="number" step="100" id="shift-final-cash" required placeholder="Ej: 45000" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-slate-500 font-mono font-bold">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">🔑 Clave / PIN Personal (Encargado Nivel 2 o Gerente Nivel 3) *</label>
          <input type="password" id="shift-close-pin" required placeholder="Tu PIN personal (ej: 2222)" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-slate-500 font-mono">
        </div>

        <div class="pt-4 flex justify-end gap-2 border-t border-slate-200">
          <button type="button" onclick="closeCloseShiftModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 font-bold rounded-xl text-xs text-slate-700">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 font-bold rounded-xl text-xs text-white shadow">Cerrar Turno y Rendir Caja</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/caja.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
