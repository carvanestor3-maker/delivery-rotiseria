<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Menú Online - La Gran Rotisería Delivery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased pb-24">

  <!-- Header Fijo con Nombre de la Rotisería -->
  <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-orange-500 rounded-2xl flex items-center justify-center font-bold text-xl shadow-lg">
          🍔
        </div>
        <div>
          <h1 id="restaurant-title" class="font-black text-lg sm:text-xl tracking-tight leading-none text-orange-400">
            LA GRAN ROTISERÍA
          </h1>
          <p class="text-xs text-slate-400 font-medium">Delivery & Minutas al Instante</p>
        </div>
      </div>
      
      <!-- Indicador de Abierto/Cerrado -->
      <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
        🟢 Abierto
      </span>
    </div>

    <!-- Pestañas de Categorías (Promos, Minutas, etc.) -->
    <nav id="category-tabs" class="max-w-4xl mx-auto px-4 pb-2.5 flex gap-2 overflow-x-auto no-scrollbar scroll-smooth">
      <!-- Se pueblan dinámicamente -->
    </nav>
  </header>

  <!-- Lista de Productos y Menú -->
  <main class="max-w-4xl mx-auto p-4 space-y-6">
    <!-- Banner Promocional -->
    <div class="bg-gradient-to-r from-orange-600 to-amber-500 rounded-2xl p-4 text-white shadow-md flex justify-between items-center">
      <div>
        <span class="bg-white/20 text-white text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-md tracking-wider">🔥 PROMO DEL DÍA</span>
        <h2 class="font-black text-lg sm:text-xl mt-1">2x1 en Hamburguesas Dobles</h2>
        <p class="text-xs text-orange-100">Incluye papas fritas familiares + gaseosa 1.5L</p>
      </div>
      <button onclick="scrollToCategory(1)" class="bg-slate-900 hover:bg-slate-800 text-orange-400 font-bold px-3 py-2 rounded-xl text-xs shadow transition">
        Ver Promos
      </button>
    </div>

    <!-- Secciones por Categorías de Comida -->
    <div id="menu-sections" class="space-y-8">
      <!-- Se llena dinámicamente -->
    </div>
  </main>

  <!-- BARRA INFERIOR FLOTANTE DEL CARRITO -->
  <div id="cart-bar" class="fixed bottom-4 left-4 right-4 max-w-lg mx-auto z-40 transform translate-y-32 opacity-0 transition-all duration-300 pointer-events-none">
    <button onclick="openCartModal()" class="w-full bg-slate-900 hover:bg-slate-800 text-white p-4 rounded-2xl shadow-2xl flex justify-between items-center border border-slate-700 active:scale-95 transition">
      <div class="flex items-center gap-3">
        <div class="relative bg-orange-500 text-white font-black w-8 h-8 rounded-xl flex items-center justify-center text-sm shadow">
          <span id="cart-badge-count">0</span>
        </div>
        <div class="text-left">
          <div class="text-xs text-slate-400 font-bold">TU PEDIDO</div>
          <div class="text-sm font-extrabold text-slate-200">Ver Carrito</div>
        </div>
      </div>
      <div class="text-right">
        <span id="cart-bar-total" class="text-lg font-black text-orange-400 font-mono">$0</span>
        <span class="text-xs text-slate-400 block font-semibold">Confirmar ➔</span>
      </div>
    </button>
  </div>

  <!-- MODAL DEL CARRITO Y FINALIZACIÓN DE PEDIDO -->
  <div id="cart-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 opacity-0 pointer-events-none transition-opacity duration-200">
    <div class="bg-white rounded-t-3xl sm:rounded-2xl max-w-lg w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      
      <!-- Modal Header -->
      <div class="p-4 bg-slate-900 text-white flex justify-between items-center border-b border-slate-800">
        <div class="flex items-center gap-2">
          <span class="text-xl">🛒</span>
          <h3 class="font-extrabold text-base">Tu Pedido</h3>
        </div>
        <button onclick="closeCartModal()" class="text-slate-400 hover:text-white p-1">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>

      <!-- Modal Body (Scrollable) -->
      <div class="p-4 flex-1 overflow-y-auto space-y-4">
        
        <!-- Tipo de Pedido: Delivery o Retiro -->
        <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl font-bold text-xs">
          <button type="button" onclick="setDeliveryType('delivery')" id="btn-type-delivery" class="py-2.5 rounded-lg transition bg-orange-500 text-white shadow">
            🛵 Delivery a Domicilio
          </button>
          <button type="button" onclick="setDeliveryType('takeaway')" id="btn-type-takeaway" class="py-2.5 rounded-lg transition text-slate-600 hover:text-slate-900">
            🏪 Retiro en Local
          </button>
        </div>

        <!-- Lista de Ítems en Carrito -->
        <div id="cart-items-list" class="divide-y divide-slate-100 border-b border-slate-100 pb-2">
          <!-- Dinámico -->
        </div>

        <!-- Formulario de Datos del Cliente -->
        <form id="checkout-form" class="space-y-3 pt-2">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre y Apellido *</label>
            <input type="text" id="cust-name" required placeholder="Ej: Juan Pérez" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Teléfono / WhatsApp *</label>
            <input type="tel" id="cust-phone" required placeholder="Ej: 3794123456" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none font-mono">
          </div>

          <div id="address-field-container">
            <label class="block text-xs font-semibold text-slate-600 mb-1">Dirección de Entrega *</label>
            <input type="text" id="cust-address" placeholder="Ej: Calle Belgrano 1234, Dpto 2B" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none">
          </div>

          <!-- Forma de Pago -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Forma de Pago *</label>
            <select id="cust-payment" onchange="handlePaymentMethodChange()" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none bg-white font-medium">
              <option value="Efectivo">💵 Efectivo (Pagas al recibir)</option>
              <option value="Tarjeta de Débito">💳 Tarjeta de Débito (Llevar Posnet)</option>
              <option value="Tarjeta de Crédito">💳 Tarjeta de Crédito (Llevar Posnet)</option>
              <option value="MercadoPago">📱 MercadoPago / QR</option>
              <option value="Transferencia">🏦 Transferencia bancaria / CBU</option>
              <option value="Link de Pago">🔗 Link de Pago por WhatsApp</option>
              <option value="Cuenta Corriente (Fiado Autorizado)">📖 Cuenta Corriente (Pago Diferido / Fiado)</option>
            </select>
          </div>

          <div id="payment-note-container">
            <label id="payment-note-label" class="block text-xs font-semibold text-slate-600 mb-1">¿Con cuánto abonas? (para el vuelto)</label>
            <input type="text" id="cust-payment-note" placeholder="Ej: Pago con $10.000 o DNI de Cuenta Corriente" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Notas / Aclaraciones para Cocina</label>
            <textarea id="cust-notes" rows="2" placeholder="Ej: Sin salsa barbacoa, timbre no funciona llamar por cel." class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none"></textarea>
          </div>
        </form>

        <!-- Resumen Financiero -->
        <div class="bg-slate-50 p-4 rounded-xl space-y-1.5 text-sm border border-slate-200">
          <div class="flex justify-between text-slate-600">
            <span>Subtotal de productos:</span>
            <span id="summary-subtotal">$0</span>
          </div>
          <div class="flex justify-between text-slate-600" id="summary-delivery-row">
            <span>Costo de envío (Delivery):</span>
            <span id="summary-delivery-cost">$0</span>
          </div>
          <hr class="border-slate-200 my-1">
          <div class="flex justify-between text-base font-extrabold text-slate-900">
            <span>TOTAL A PAGAR:</span>
            <span id="summary-total" class="text-orange-600 font-black text-lg">$0</span>
          </div>
        </div>

      </div>

      <!-- Modal Footer - Botón WhatsApp -->
      <div class="p-4 bg-white border-t border-slate-200">
        <button type="button" onclick="submitOrderToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-extrabold py-3.5 px-4 rounded-xl shadow-lg flex items-center justify-center gap-2 transition text-base">
          <span class="text-xl">💬</span> Confirmar y Enviar Pedido por WhatsApp
        </button>
      </div>

    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
