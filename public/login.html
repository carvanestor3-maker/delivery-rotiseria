<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso Personal — La Gran Rotisería</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="/apple-touch-icon.png">
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-8 space-y-5">
    <div class="text-center space-y-1">
      <div class="text-4xl">🔒</div>
      <h1 class="font-extrabold text-slate-900 text-lg">Acceso de Personal</h1>
      <p class="text-xs text-slate-500">Ingresá tu PIN para entrar al panel interno.</p>
    </div>

    <form id="login-form" onsubmit="submitLogin(event)" class="space-y-3">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">PIN</label>
        <input type="password" id="login-pin" inputmode="numeric" autocomplete="off" autofocus required
          class="w-full text-center tracking-[0.5em] text-2xl font-mono px-4 py-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-orange-500">
      </div>
      <div id="login-error" class="hidden text-xs font-bold text-red-600 bg-red-50 border border-red-200 rounded-xl px-3 py-2"></div>
      <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-extrabold py-3 rounded-xl text-sm shadow-md transition">
        Ingresar
      </button>
    </form>
  </div>

  <script>
    function getNextUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('next') || '/admin.html';
    }

    async function submitLogin(e) {
      e.preventDefault();
      const pin = document.getElementById('login-pin').value.trim();
      const errBox = document.getElementById('login-error');
      errBox.classList.add('hidden');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = getNextUrl();
        } else {
          errBox.textContent = data.error || 'PIN incorrecto.';
          errBox.classList.remove('hidden');
          document.getElementById('login-pin').value = '';
          document.getElementById('login-pin').focus();
        }
      } catch (err) {
        errBox.textContent = 'Error de conexión con el servidor.';
        errBox.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
