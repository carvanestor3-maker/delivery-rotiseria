<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planilla de Stock</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, Helvetica, sans-serif; color: #111; margin: 0; background: #e5e7eb; }
    .toolbar { position: sticky; top: 0; background: #0f172a; color: #fff; padding: 10px 16px; display: flex; gap: 10px; align-items: center; justify-content: space-between; z-index: 5; }
    .toolbar button { background: #f59e0b; color: #111; border: 0; border-radius: 8px; padding: 8px 16px; font-weight: 800; cursor: pointer; font-size: 14px; }
    .toolbar span { font-size: 13px; opacity: .85; }
    .sheet { background: #fff; width: 210mm; min-height: 297mm; margin: 14px auto; padding: 12mm 12mm 14mm; box-shadow: 0 2px 12px rgba(0,0,0,.25); }
    h1 { font-size: 18px; margin: 0 0 2px; }
    .sub { font-size: 12px; color: #444; margin: 0 0 8px; }
    .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 16px; font-size: 12px; border: 1px solid #111; padding: 6px 8px; margin-bottom: 8px; }
    .meta b { font-weight: 800; }
    .live-note { background: #fef3c7; border: 1px solid #f59e0b; padding: 5px 8px; font-size: 11px; margin-bottom: 8px; }
    .howto { font-size: 11px; border: 1px dashed #666; padding: 5px 8px; margin-bottom: 8px; line-height: 1.35; }
    table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
    thead { display: table-header-group; }
    th, td { border: 1px solid #111; padding: 4px 5px; }
    th { background: #e5e7eb; text-align: left; font-size: 11px; }
    td.num, th.num { text-align: right; font-family: "Courier New", monospace; white-space: nowrap; }
    td.blank { width: 22mm; }
    td.obs { width: 34mm; }
    tr { page-break-inside: avoid; }
    tr.group td { background: #111; color: #fff; font-weight: 800; letter-spacing: .5px; font-size: 11px; }
    .sign { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 22px; font-size: 12px; page-break-inside: avoid; }
    .sign div { border-top: 1px solid #111; padding-top: 4px; text-align: center; }
    .foot { margin-top: 8px; font-size: 10px; color: #555; }
    .empty { padding: 30px; text-align: center; color: #666; }
    @page { size: A4; margin: 0; }
    @media print {
      body { background: #fff; }
      .toolbar { display: none; }
      .sheet { margin: 0; box-shadow: none; width: 210mm; min-height: auto; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span id="tb-info">Cargando planilla…</span>
    <button onclick="window.print()">🖨️ Imprimir</button>
  </div>
  <div class="sheet" id="sheet"><div class="empty">Cargando…</div></div>

<script>
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function fmtQty(n) {
    return new Intl.NumberFormat('es-AR', { maximumFractionDigits: 3 }).format(n || 0);
  }
  function fmtDate(iso) {
    try { return new Date(iso).toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' }); } catch (e) { return iso || ''; }
  }

  async function init() {
    const params = new URLSearchParams(location.search);
    const id = params.get('id') || 'latest';
    const autoPrint = params.get('print') === '1';
    const sheet = document.getElementById('sheet');
    try {
      const res = await fetch('/api/cash/stock-snapshot/' + encodeURIComponent(id));
      const data = await res.json();
      if (!data.success || !data.snapshot) {
        sheet.innerHTML = '<div class="empty">' + esc(data.error || 'Todavía no hay ninguna planilla de stock guardada. Se genera sola al cerrar una caja.') + '</div>';
        document.getElementById('tb-info').textContent = 'Sin planilla';
        return;
      }
      render(data.snapshot);
      if (autoPrint) setTimeout(() => window.print(), 400);
    } catch (err) {
      sheet.innerHTML = '<div class="empty">No se pudo cargar la planilla: ' + esc(err.message) + '</div>';
    }
  }

  function render(snap) {
    const live = !!snap.live;
    const title = live ? 'Planilla de Stock — Stock actual del sistema' : 'Planilla de Stock al Cierre de Caja';
    document.title = title + (snap.id ? ' #' + snap.id : '');
    document.getElementById('tb-info').textContent = live ? 'Stock en vivo (no guardado)' : 'Planilla #' + snap.id;

    const groups = [
      { type: 'insumo', label: 'INSUMOS / MERCADERÍA' },
      { type: 'semi', label: 'PRE-ARMADOS / SEMIELABORADOS' }
    ];
    let n = 0;
    let rows = '';
    groups.forEach(g => {
      const list = (snap.items || []).filter(i => i.type === g.type);
      if (list.length === 0) return;
      rows += '<tr class="group"><td colspan="7">' + g.label + '</td></tr>';
      list.forEach(i => {
        n++;
        rows += '<tr>' +
          '<td class="num">' + n + '</td>' +
          '<td>' + esc(i.code) + '</td>' +
          '<td>' + esc(i.name) + '</td>' +
          '<td>' + esc(i.unit) + '</td>' +
          '<td class="num"><b>' + fmtQty(i.system_stock) + '</b></td>' +
          '<td class="blank"></td>' +
          '<td class="obs"></td>' +
          '</tr>';
      });
    });
    if (n === 0) rows = '<tr><td colspan="7" class="empty">No hay insumos ni pre-armados cargados.</td></tr>';

    const meta = live
      ? '<div><b>Impresa:</b> ' + fmtDate(snap.created_at) + '</div><div></div>'
      : '<div><b>Planilla N°:</b> ' + snap.id + '</div>' +
        '<div><b>Caja cerrada:</b> N° ' + esc(snap.box_number) + '</div>' +
        '<div><b>Fecha y hora del cierre:</b> ' + fmtDate(snap.created_at) + '</div>' +
        '<div><b>Cerró:</b> ' + esc(snap.closed_by) + (snap.cashier_name ? ' (cajero: ' + esc(snap.cashier_name) + ')' : '') + '</div>';

    document.getElementById('sheet').innerHTML =
      '<h1>' + title + '</h1>' +
      '<p class="sub">Stock que figura en el sistema. Para controlar contra el stock físico al abrir la próxima caja.</p>' +
      '<div class="meta">' + meta + '</div>' +
      (live ? '<div class="live-note">Esta planilla muestra el stock <b>en este momento</b>. La planilla oficial de cierre se genera sola al cerrar la caja.</div>' : '') +
      '<div class="howto"><b>Cómo usar:</b> contá lo que hay físicamente y anotá el número en <b>"Conteo físico"</b>. Si coincide con "Stock sistema", dejá la fila en blanco o tildala. ' +
      'Si hay diferencia, anotala y cargala al abrir la caja: queda registrada (el stock del sistema no se modifica solo).</div>' +
      '<table><thead><tr>' +
      '<th class="num" style="width:8mm">#</th><th style="width:20mm">Código</th><th>Insumo / Producto</th><th style="width:14mm">Unidad</th>' +
      '<th class="num" style="width:26mm">Stock sistema</th><th class="num" style="width:22mm">Conteo físico</th><th>Observaciones</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>' +
      diffSection(snap) +
      '<div class="sign"><div>Firma de quien cierra / entrega</div><div>Firma de quien abre / controla</div></div>' +
      '<div class="foot">Generado por el sistema · ' + fmtDate(new Date().toISOString()) + '</div>';
  }

  function diffSection(snap) {
    const d = snap.diff_items || [];
    if (!d.length) return '';
    return '<h3 style="font-size:13px;margin:14px 0 4px;">Diferencias informadas al abrir la caja (' + esc(snap.verified_by || '') + ' · ' + fmtDate(snap.verified_at) + ')</h3>' +
      '<table><thead><tr><th>Insumo / Producto</th><th class="num">Sistema</th><th class="num">Conteo real</th><th class="num">Diferencia</th></tr></thead><tbody>' +
      d.map(x => '<tr><td>' + esc(x.name) + '</td><td class="num">' + fmtQty(x.system_stock) + ' ' + esc(x.unit) + '</td><td class="num">' + fmtQty(x.counted_stock) + ' ' + esc(x.unit) + '</td><td class="num"><b>' + (x.difference > 0 ? '+' : '') + fmtQty(x.difference) + '</b></td></tr>').join('') +
      '</tbody></table><p class="foot">Solo registradas: el stock del sistema no fue modificado.</p>';
  }

  init();
</script>
</body>
</html>
